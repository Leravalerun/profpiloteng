<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open UX Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-8">
  <div class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-8">
    <h1 class="text-2xl font-bold mb-4">🎨 UX Designer Simulator</h1>
    <p class="text-slate-600 mb-6">Click the button below to grant access and open the simulator.</p>
    
    <button 
      onclick="grantAndOpen()" 
      class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-6 rounded-xl transition-colors">
      ✅ Grant Access & Open Simulator
    </button>
    
    <div id="status" class="mt-4 p-4 rounded-lg hidden"></div>
  </div>

  <script>
    function grantAndOpen() {
      // Выдаем доступ для UX Designer
      const testData = {
        simulator: 'ux-designer',
        email: 'test@example.com',
        accessGranted: true,
        allSimulators: true,
        paymentId: 'test-ux-' + Date.now(),
        status: 'confirmed',
        createdAt: new Date().toISOString()
      };

      localStorage.setItem('testPaymentData', JSON.stringify(testData));
      
      localStorage.setItem('paymentData', JSON.stringify({
        simulator: 'ux-designer',
        userEmail: 'test@example.com',
        status: 'confirmed',
        id: testData.paymentId,
        timestamp: new Date().toISOString(),
        allSimulators: true
      }));

      const statusDiv = document.getElementById('status');
      statusDiv.className = 'mt-4 p-4 bg-green-50 border border-green-200 rounded-lg text-green-800';
      statusDiv.innerHTML = '✅ Access granted! Opening simulator...';
      statusDiv.classList.remove('hidden');

      // Открываем симулятор через небольшую задержку
      setTimeout(() => {
        window.location.href = '/ux-sim-simple.html';
      }, 500);
    }

    // Автоматически выдаем доступ при загрузке страницы
    window.addEventListener('load', () => {
      grantAndOpen();
    });
  </script>
</body>
</html>

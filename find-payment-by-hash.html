<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Payment by TX Hash - ProfPilot Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-init.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-slate-900 mb-2">Find Payment by TX Hash</h1>
      <p class="text-slate-600">Search for payment records using transaction hash</p>
    </div>

    <!-- Search Form -->
    <div class="bg-white rounded-xl p-6 border border-slate-200 mb-6">
      <div class="flex gap-4">
        <input 
          type="text" 
          id="txHashInput" 
          placeholder="Enter transaction hash (e.g. TQn9Y2khEsLJW1ChVWFMSMeRDow5KcbLSE)" 
          class="flex-1 border border-slate-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-brand-500 focus:border-transparent"
          value="TQn9Y2khEsLJW1ChVWFMSMeRDow5KcbLSE"
        >
        <button 
          onclick="searchPayment()" 
          class="bg-brand-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-brand-700 transition-colors">
          🔍 Search
        </button>
      </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="text-center py-12 hidden">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-brand-600"></div>
      <p class="mt-4 text-slate-600">Searching...</p>
    </div>

    <!-- Results -->
    <div id="results" class="hidden">
      <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
        <div class="p-6">
          <h2 class="text-2xl font-bold text-slate-900 mb-6">Payment Details</h2>
          <div id="paymentDetails" class="space-y-4"></div>
        </div>
      </div>
    </div>

    <!-- Error Message -->
    <div id="errorMessage" class="hidden mt-6 bg-red-50 border border-red-200 rounded-xl p-4">
      <p class="text-red-800" id="errorText"></p>
    </div>

    <!-- No Results -->
    <div id="noResults" class="hidden mt-6 bg-yellow-50 border border-yellow-200 rounded-xl p-6 text-center">
      <p class="text-yellow-800">No payment found with this transaction hash.</p>
      <p class="text-yellow-700 text-sm mt-2">The payment might not be recorded in Firebase yet, or the hash might be incorrect.</p>
    </div>
  </div>

  <script>
    async function searchPayment() {
      const txHash = document.getElementById('txHashInput').value.trim();
      
      if (!txHash) {
        alert('Please enter a transaction hash');
        return;
      }

      const loadingEl = document.getElementById('loading');
      const resultsEl = document.getElementById('results');
      const errorEl = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');
      const noResultsEl = document.getElementById('noResults');
      
      // Hide all
      loadingEl.classList.remove('hidden');
      resultsEl.classList.add('hidden');
      errorEl.classList.add('hidden');
      noResultsEl.classList.add('hidden');

      try {
        // Wait for Firebase to initialize
        await waitForFirebase();

        const db = firebase.firestore();
        
        // Search in purchases collection
        const snapshot = await db.collection('purchases')
          .where('transactionHash', '==', txHash)
          .get();

        if (snapshot.empty) {
          // Also try searching in payments collection (if it exists)
          const paymentsSnapshot = await db.collection('payments')
            .where('transactionHash', '==', txHash)
            .get();
          
          if (paymentsSnapshot.empty) {
            // Try searching by cryptoAddress (sometimes hash is stored there)
            const addressSnapshot = await db.collection('purchases')
              .where('cryptoAddress', '==', txHash)
              .get();
            
            if (addressSnapshot.empty) {
              loadingEl.classList.add('hidden');
              noResultsEl.classList.remove('hidden');
              return;
            } else {
              displayPayment(addressSnapshot.docs[0]);
            }
          } else {
            displayPayment(paymentsSnapshot.docs[0], 'payments');
          }
        } else {
          displayPayment(snapshot.docs[0]);
        }

        loadingEl.classList.add('hidden');
        resultsEl.classList.remove('hidden');
      } catch (error) {
        console.error('Error searching payment:', error);
        errorText.textContent = `Error: ${error.message}`;
        errorEl.classList.remove('hidden');
        loadingEl.classList.add('hidden');
      }
    }

    function displayPayment(doc, collection = 'purchases') {
      const data = doc.data();
      const detailsDiv = document.getElementById('paymentDetails');
      
      const formatDate = (timestamp) => {
        if (!timestamp) return 'N/A';
        const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
        return date.toLocaleString('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          timeZoneName: 'short'
        });
      };

      const formatCurrency = (amount, currency = 'USD') => {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: currency
        }).format(amount || 0);
      };

      let html = `
        <div class="grid md:grid-cols-2 gap-6">
          <div>
            <h3 class="text-sm font-semibold text-slate-500 uppercase mb-2">Payment ID</h3>
            <p class="text-lg font-mono text-slate-900">${doc.id}</p>
          </div>
          <div>
            <h3 class="text-sm font-semibold text-slate-500 uppercase mb-2">Status</h3>
            <span class="inline-block px-3 py-1 rounded-full text-sm font-semibold ${
              data.status === 'confirmed' ? 'bg-green-100 text-green-800' :
              data.status === 'pending' ? 'bg-yellow-100 text-yellow-800' :
              'bg-red-100 text-red-800'
            }">${data.status || 'unknown'}</span>
          </div>
          <div>
            <h3 class="text-sm font-semibold text-slate-500 uppercase mb-2">User Email</h3>
            <p class="text-lg text-slate-900">${data.userId || data.userEmail || 'N/A'}</p>
          </div>
          <div>
            <h3 class="text-sm font-semibold text-slate-500 uppercase mb-2">Simulator</h3>
            <p class="text-lg text-slate-900 capitalize">${data.simulator || 'N/A'}</p>
          </div>
          <div>
            <h3 class="text-sm font-semibold text-slate-500 uppercase mb-2">Amount</h3>
            <p class="text-lg font-semibold text-slate-900">${formatCurrency(data.amount, data.currency)}</p>
          </div>
          <div>
            <h3 class="text-sm font-semibold text-slate-500 uppercase mb-2">Currency</h3>
            <p class="text-lg text-slate-900">${data.currency || 'USD'}</p>
          </div>
          <div>
            <h3 class="text-sm font-semibold text-slate-500 uppercase mb-2">Transaction Hash</h3>
            <p class="text-sm font-mono text-slate-900 break-all">
              <a href="https://tronscan.org/#/transaction/${data.transactionHash || data.txHash}" 
                 target="_blank" 
                 class="text-brand-600 hover:underline">
                ${data.transactionHash || data.txHash || 'N/A'}
              </a>
            </p>
          </div>
          <div>
            <h3 class="text-sm font-semibold text-slate-500 uppercase mb-2">Crypto Address</h3>
            <p class="text-sm font-mono text-slate-900 break-all">${data.cryptoAddress || 'N/A'}</p>
          </div>
          <div>
            <h3 class="text-sm font-semibold text-slate-500 uppercase mb-2">Created At</h3>
            <p class="text-slate-900">${formatDate(data.createdAt || data.timestamp)}</p>
          </div>
          <div>
            <h3 class="text-sm font-semibold text-slate-500 uppercase mb-2">Confirmed At</h3>
            <p class="text-slate-900">${formatDate(data.confirmedAt)}</p>
          </div>
          <div>
            <h3 class="text-sm font-semibold text-slate-500 uppercase mb-2">Promo Code</h3>
            <p class="text-slate-900">${data.promoCode || 'None'}</p>
          </div>
          <div>
            <h3 class="text-sm font-semibold text-slate-500 uppercase mb-2">Original Price</h3>
            <p class="text-slate-900">${formatCurrency(data.originalPrice || data.amount)}</p>
          </div>
          <div>
            <h3 class="text-sm font-semibold text-slate-500 uppercase mb-2">Discount</h3>
            <p class="text-slate-900">${formatCurrency(data.discount || 0)}</p>
          </div>
          <div>
            <h3 class="text-sm font-semibold text-slate-500 uppercase mb-2">Access Expires</h3>
            <p class="text-slate-900">${formatDate(data.accessExpiresAt)}</p>
          </div>
        </div>
      `;

      // Add full data dump
      html += `
        <div class="mt-8 pt-6 border-t border-slate-200">
          <h3 class="text-sm font-semibold text-slate-500 uppercase mb-3">Full Data (JSON)</h3>
          <pre class="bg-slate-100 p-4 rounded-lg text-xs overflow-auto max-h-96">${JSON.stringify({
            id: doc.id,
            ...data,
            createdAt: data.createdAt ? formatDate(data.createdAt) : null,
            confirmedAt: data.confirmedAt ? formatDate(data.confirmedAt) : null,
            accessExpiresAt: data.accessExpiresAt ? formatDate(data.accessExpiresAt) : null
          }, null, 2)}</pre>
        </div>
      `;

      detailsDiv.innerHTML = html;
    }

    function waitForFirebase() {
      return new Promise((resolve, reject) => {
        if (typeof firebase !== 'undefined' && firebase.firestore) {
          resolve();
          return;
        }
        
        let attempts = 0;
        const checkInterval = setInterval(() => {
          attempts++;
          if (typeof firebase !== 'undefined' && firebase.firestore) {
            clearInterval(checkInterval);
            resolve();
          } else if (attempts > 50) {
            clearInterval(checkInterval);
            reject(new Error('Firebase initialization timeout'));
          }
        }, 100);
      });
    }

    // Auto-search on load if hash is in input
    window.addEventListener('load', () => {
      const txHashInput = document.getElementById('txHashInput');
      if (txHashInput.value.trim()) {
        searchPayment();
      }
    });
  </script>
</body>
</html>

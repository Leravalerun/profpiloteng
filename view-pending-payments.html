<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pending Payments - ProfPilot Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-init.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-slate-900 mb-2">Payments - Last 7 Days</h1>
      <p class="text-slate-600">View all payments and incomplete checkouts from the past week</p>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <div class="bg-white rounded-xl p-6 border border-slate-200">
        <div class="text-sm text-slate-600 mb-1">Pending Payments</div>
        <div class="text-3xl font-bold text-yellow-600" id="pendingCount">-</div>
      </div>
      <div class="bg-white rounded-xl p-6 border border-slate-200">
        <div class="text-sm text-slate-600 mb-1">Incomplete Checkouts</div>
        <div class="text-3xl font-bold text-orange-600" id="incompleteCount">-</div>
      </div>
      <div class="bg-white rounded-xl p-6 border border-slate-200">
        <div class="text-sm text-slate-600 mb-1">No Transaction Hash</div>
        <div class="text-3xl font-bold text-red-600" id="noHashCount">-</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="bg-white rounded-xl p-6 border border-slate-200 mb-6">
      <div class="flex flex-col sm:flex-row gap-4 items-center justify-between">
        <div class="flex gap-4">
          <button onclick="loadPayments()" class="bg-brand-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-brand-700 transition-colors">
            🔄 Refresh
          </button>
          <button onclick="exportPending()" class="border border-slate-300 text-slate-700 px-6 py-2 rounded-lg font-semibold hover:bg-slate-50 transition-colors">
            📥 Export CSV
          </button>
        </div>
        <div class="flex gap-4 items-center">
          <select id="filterStatus" onchange="filterPayments()" class="border border-slate-300 rounded-lg px-4 py-2">
            <option value="last-week" selected>Last 7 Days</option>
            <option value="all">All Time</option>
            <option value="pending">Pending</option>
            <option value="no-hash">No Transaction Hash</option>
            <option value="recent">Last 24 Hours</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="text-center py-12 hidden">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-brand-600"></div>
      <p class="mt-4 text-slate-600">Loading payments...</p>
    </div>

    <!-- Payments Table -->
    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="bg-slate-50 border-b border-slate-200">
            <tr>
              <th class="px-6 py-4 text-left text-xs font-semibold text-slate-700 uppercase tracking-wider">Email</th>
              <th class="px-6 py-4 text-left text-xs font-semibold text-slate-700 uppercase tracking-wider">Simulator</th>
              <th class="px-6 py-4 text-left text-xs font-semibold text-slate-700 uppercase tracking-wider">Amount</th>
              <th class="px-6 py-4 text-left text-xs font-semibold text-slate-700 uppercase tracking-wider">Status</th>
              <th class="px-6 py-4 text-left text-xs font-semibold text-slate-700 uppercase tracking-wider">Created</th>
              <th class="px-6 py-4 text-left text-xs font-semibold text-slate-700 uppercase tracking-wider">Transaction Hash</th>
              <th class="px-6 py-4 text-left text-xs font-semibold text-slate-700 uppercase tracking-wider">Time Since</th>
            </tr>
          </thead>
          <tbody id="paymentsTable" class="divide-y divide-slate-200">
            <tr>
              <td colspan="7" class="px-6 py-12 text-center text-slate-500">No payments found. Click "Refresh" to load.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Error Message -->
    <div id="errorMessage" class="hidden mt-6 bg-red-50 border border-red-200 rounded-xl p-4">
      <p class="text-red-800" id="errorText"></p>
    </div>
  </div>

  <script>
    let allPayments = [];
    let filteredPayments = [];

    async function loadPayments() {
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');
      
      loadingEl.classList.remove('hidden');
      errorEl.classList.add('hidden');

      try {
        await waitForFirebase();

        const db = firebase.firestore();
        
        // Get all payments (pending and confirmed)
        const snapshot = await db.collection('purchases')
          .orderBy('createdAt', 'desc')
          .limit(100)
          .get();

        allPayments = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          allPayments.push({
            id: doc.id,
            ...data,
            createdAt: data.createdAt ? (data.createdAt.toDate ? data.createdAt.toDate() : new Date(data.createdAt)) : null,
            confirmedAt: data.confirmedAt ? (data.confirmedAt.toDate ? data.confirmedAt.toDate() : new Date(data.confirmedAt)) : null
          });
        });

        updateStats();
        filterPayments();
        loadingEl.classList.add('hidden');
      } catch (error) {
        console.error('Error loading payments:', error);
        errorText.textContent = `Error: ${error.message}`;
        errorEl.classList.remove('hidden');
        loadingEl.classList.add('hidden');
      }
    }

    function waitForFirebase() {
      return new Promise((resolve, reject) => {
        if (typeof firebase !== 'undefined' && firebase.firestore) {
          resolve();
          return;
        }
        
        let attempts = 0;
        const checkInterval = setInterval(() => {
          attempts++;
          if (typeof firebase !== 'undefined' && firebase.firestore) {
            clearInterval(checkInterval);
            resolve();
          } else if (attempts > 50) {
            clearInterval(checkInterval);
            reject(new Error('Firebase initialization timeout'));
          }
        }, 100);
      });
    }

    function updateStats() {
      // Calculate stats for last 7 days
      const last7Days = allPayments.filter(p => {
        if (!p.createdAt) return false;
        const daysAgo = (Date.now() - p.createdAt.getTime()) / (1000 * 60 * 60 * 24);
        return daysAgo <= 7;
      });

      const pending = last7Days.filter(p => p.status === 'pending').length;
      const noHash = last7Days.filter(p => !p.transactionHash && p.status === 'pending').length;
      const incomplete = last7Days.filter(p => !p.transactionHash || p.status === 'pending').length;

      document.getElementById('pendingCount').textContent = pending;
      document.getElementById('incompleteCount').textContent = incomplete;
      document.getElementById('noHashCount').textContent = noHash;
    }

    function filterPayments() {
      const filter = document.getElementById('filterStatus').value;

      filteredPayments = allPayments.filter(payment => {
        if (filter === 'pending') {
          return payment.status === 'pending';
        } else if (filter === 'no-hash') {
          return !payment.transactionHash && payment.status === 'pending';
        } else if (filter === 'recent') {
          if (!payment.createdAt) return false;
          const hoursAgo = (Date.now() - payment.createdAt.getTime()) / (1000 * 60 * 60);
          return hoursAgo <= 24;
        } else if (filter === 'last-week') {
          if (!payment.createdAt) return false;
          const daysAgo = (Date.now() - payment.createdAt.getTime()) / (1000 * 60 * 60 * 24);
          return daysAgo <= 7;
        }
        return true;
      });

      renderPayments();
    }

    function renderPayments() {
      const tbody = document.getElementById('paymentsTable');
      
      if (filteredPayments.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-12 text-center text-slate-500">No payments found.</td></tr>';
        return;
      }

      tbody.innerHTML = filteredPayments.map(payment => {
        const statusColor = {
          'confirmed': 'bg-green-100 text-green-800',
          'pending': 'bg-yellow-100 text-yellow-800',
          'failed': 'bg-red-100 text-red-800'
        }[payment.status] || 'bg-slate-100 text-slate-800';

        const createdAt = payment.createdAt ? 
          new Date(payment.createdAt).toLocaleString('en-US', { 
            year: 'numeric', 
            month: 'short', 
            day: 'numeric', 
            hour: '2-digit', 
            minute: '2-digit' 
          }) : 'N/A';

        const timeSince = payment.createdAt ? 
          getTimeSince(payment.createdAt) : 'N/A';

        const hasHash = payment.transactionHash ? 'Yes' : '❌ No';
        const hashDisplay = payment.transactionHash ? 
          `<a href="https://tronscan.org/#/transaction/${payment.transactionHash}" target="_blank" class="text-brand-600 hover:underline">${payment.transactionHash.substring(0, 10)}...</a>` : 
          '<span class="text-red-600 font-semibold">Not provided</span>';

        return `
          <tr class="hover:bg-slate-50">
            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-900">${payment.userId || payment.userEmail || 'N/A'}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-900 capitalize">${payment.simulator || 'N/A'}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold text-slate-900">$${parseFloat(payment.amount || 0).toFixed(2)}</td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span class="px-2 py-1 rounded-full text-xs font-semibold ${statusColor}">${payment.status || 'unknown'}</span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600">${createdAt}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm">${hashDisplay}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600">${timeSince}</td>
          </tr>
        `;
      }).join('');
    }

    function getTimeSince(date) {
      const now = new Date();
      const diff = now - date;
      const minutes = Math.floor(diff / 60000);
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);

      if (days > 0) return `${days}d ago`;
      if (hours > 0) return `${hours}h ago`;
      if (minutes > 0) return `${minutes}m ago`;
      return 'Just now';
    }

    function exportPending() {
      const pending = filteredPayments.filter(p => p.status === 'pending' && !p.transactionHash);
      
      if (pending.length === 0) {
        alert('No pending payments to export');
        return;
      }

      const headers = ['Email', 'Simulator', 'Amount', 'Status', 'Created', 'Promo Code'];
      const rows = pending.map(p => [
        p.userId || p.userEmail || '',
        p.simulator || '',
        p.amount || 0,
        p.status || '',
        p.createdAt ? new Date(p.createdAt).toISOString() : '',
        p.promoCode || ''
      ]);

      const csv = [
        headers.join(','),
        ...rows.map(row => row.map(cell => `"${cell}"`).join(','))
      ].join('\n');

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `pending-payments-${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      window.URL.revokeObjectURL(url);
    }

    // Load payments on page load
    window.addEventListener('DOMContentLoaded', () => {
      loadPayments();
      // Set default filter to last week
      document.getElementById('filterStatus').value = 'last-week';
    });
  </script>
</body>
</html>
